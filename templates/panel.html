<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel Prospectos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Prospectos</h1>
            <h4>Total de prospectos: {{ total }}</h4>
        </div>

        <a href="/logout" class="btn btn-secondary">
            Cerrar sesión
        </a>

    </div>

    <div class="table-responsive">

        <table class="table table-striped table-bordered align-middle">

            <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Mensaje</th>
                    <th>Fecha</th>
                    <th>WhatsApp</th>
                    <th>Eliminar</th>
                </tr>

            </thead>

            <tbody>

                {% for p in prospectos %}

                <tr>
                    <td>{{ p[0] }}</td>
                    <td>{{ p[1] }}</td>
                    <td>{{ p[2] }}</td>
                    <td>{{ p[3] }}</td>
                    <td>{{ p[4] }}</td>
                    <td>{{ p[5] }}</td>

                    <td>
                        <a
                            href="https://wa.me/52{{ p[2] }}"
                            target="_blank"
                            class="btn btn-success btn-sm">
                            WhatsApp
                        </a>
                    </td>

                    <td>
                        <a
                            href="/eliminar/{{ p[0] }}"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Eliminar prospecto?')">
                            Eliminar
                        </a>
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
